# Render Blueprint for the Python API (New → Blueprint → this repo). The web UI deploys to Vercel from web/.
services:
  - type: web
    name: jev-lab-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/projects
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENROUTER_API_KEY   # typed into the Render dashboard, never committed
        sync: false
      - key: OPENAI_API_KEY       # project 25's chess opponent; Render dashboard
        sync: false
      - key: WEB_ORIGINS          # the Vercel URL, e.g. https://jev-labs.vercel.app (CORS for the paid POSTs)
        sync: false
      - key: WEB_ORIGIN_REGEX     # Vercel per-deploy URLs, e.g. https://jev(lab)?-[a-z0-9-]+-<team>\.vercel\.app
        sync: false
      - key: WEB_UI_URL           # same Vercel URL; Streamlit's "open in the new UI" link
        sync: false
      - key: REDIS_URL            # the nav's visitor counter (api/presence.py)
        fromService:
          type: keyvalue
          name: jev-lab-counter
          property: connectionString
      - key: LANGFUSE_TRACING_ENABLED   # Langfuse is a local docker container
        value: "false"
      # Spam caps on the paid calls (0 = off). Worst case at these values stays well under $2/day.
      - key: RUN_LIMIT_PER_IP_HOUR
        value: "20"
      - key: RUN_LIMIT_PER_DAY
        value: "300"
      - key: DATASET_LIMIT_PER_IP_HOUR
        value: "3"
      - key: DATASET_LIMIT_PER_DAY
        value: "30"

  # The original Streamlit UI (the web UI's "Streamlit" toggle). Same caps as the API, counted separately (core/limits.py).
  - type: web
    name: jev-lab-streamlit
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENROUTER_API_KEY   # same key as the API, typed into the Render dashboard
        sync: false
      - key: OPENAI_API_KEY       # project 25's chess opponent; Render dashboard
        sync: false
      - key: WEB_UI_URL           # the Vercel URL; the sidebar's "Open in the new UI" link
        sync: false
      - key: LANGFUSE_TRACING_ENABLED
        value: "false"
      - key: RUN_LIMIT_PER_IP_HOUR
        value: "20"
      - key: RUN_LIMIT_PER_DAY
        value: "300"
      - key: DATASET_LIMIT_PER_IP_HOUR
        value: "3"
      - key: DATASET_LIMIT_PER_DAY
        value: "30"

  # Free Redis for the nav's live/visitor counter. ponytail: free plan has no disk persistence, so the
  # visitor total resets if Render restarts the instance (rare); starter plan + persistence if it matters.
  - type: keyvalue
    name: jev-lab-counter
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []   # internal only: just the API talks to it
